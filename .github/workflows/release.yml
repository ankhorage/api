name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.ANKHORAGE_RENOVATE_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.ANKHORAGE_RENOVATE_SYNC_PRIVATE_KEY }}
          owner: ankhorage
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: bun install
      - run: bun run build
      - name: Version package
        run: |
          if [ -z "$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit)" ]; then
            exit 0
          fi
          bun run version-packages
          git config user.name "ankhorage-renovate-sync[bot]"
          git config user.email "ankhorage-renovate-sync[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore(release): version packages [skip ci]"
          git push origin HEAD:main
      - run: bun run changeset -- publish
